name: zhongju-site

services:
  # 后端名片 API（Node.js + MySQL）
  api:
    build:
      context: ../server
    container_name: zhongju-card-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mysql-common}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-zhongju_cards}
      STAFF_TOKEN: ${STAFF_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      DAILY_LIMIT: ${DAILY_LIMIT:-5}
      LOGIN_LIMIT: ${LOGIN_LIMIT:-10}
      PORT: "8787"
    networks:
      - internal
      - shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 官网静态站 + Nginx（同时反代 /api）
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_CARD_SERVER: "on"
        VITE_CARD_API_BASE: ""
    container_name: zhongju-site-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 只对外暴露这一个端口；若已有宿主 Nginx，改成 "127.0.0.1:8080:80"
      - "${HTTP_PORT:-80}:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge
  shared:
    external: true
    # 改成你服务器上公共 MySQL 所在的桥接网络名（docker network ls 查看）
    name: ${SHARED_NETWORK:-bridge-network}
