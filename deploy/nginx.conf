# 中聚人力官网 + 名片 API
# 站点：静态文件（SPA 回退）  /api：反向代理到后端容器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传头像为 dataURL，后端限制 2MB，这里放宽到 4MB
    client_max_body_size 4m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带指纹的静态资源长缓存（文件名带 hash，内容变了文件名就变）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 图片等静态文件：中等缓存
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 接口反向代理（同域，前端无需 CORS）
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA 路由回退：/card/xxx、/admin 等由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 永不缓存：内部工具页（/admin、/create、/card）经 try_files 回退到这里，
    # 从而保证改了版本后不会拿到旧 HTML（带指纹的 /assets/ 仍然长缓存）
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
