services:
  contract-api:
    build: ../server
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mysql-common}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-zhongju_contract}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-zhongju_contracts}
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-12}
      LOGIN_LIMIT: ${LOGIN_LIMIT:-10}
      LOGIN_LOCK_FAILS: ${LOGIN_LOCK_FAILS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-30}
      FILES_DIR: /data/files
    volumes:
      - contract-files:/data/files
    networks: [shared]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  contract-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on: [contract-api]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8090}:80"
    networks: [shared]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  contract-files:

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-bridge-network}
