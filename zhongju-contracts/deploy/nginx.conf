server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API：转发到 contract-api 容器（路径保持 /api/contract/*）
    location /api/contract/ {
        proxy_pass http://contract-api:8790;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # 合同系统前端（SPA 回退）
    location = /contracts {
        return 301 /contracts/;
    }
    location /contracts/ {
        try_files $uri $uri/ /contracts/index.html;
        add_header Cache-Control "no-store";
    }

    # 其他路径一律 404（官网由 zhongju-site 的 web 容器负责）
    location / {
        return 404;
    }
}
